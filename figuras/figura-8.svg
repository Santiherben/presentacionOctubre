F66;font-weight:400;font-style:normal;"><html:div><html:b>Síntesis TAP</html:b><html:br/>Comparación entre cinco casos<html:br/>Intervenciones y estímulos efectivos</html:div></html:div></foreignObject><rect x="485.0" y="360.0" width="390.0" height="105.0" rx="0" fill="#E3ECF1" stroke="#6B7D88" stroke-width="1.4"/><foreignObject x="485.0" y="360.0" width="390.0" height="105.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:8.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:23.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>Síntesis DV</html:b><html:br/>Secuencias completas y aporte parcial<html:br/>Condiciones y estímulos por episodio</html:div></html:div></foreignObject><rect x="90.0" y="537.0" width="740.0" height="133.0" rx="0" fill="#EBC6B0" stroke="#6B7D88" stroke-width="1.4"/><foreignObject x="90.0" y="537.0" width="740.0" height="133.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:8.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:23.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>Matriz conjunta por unidad analítica común</html:b><html:br/>Resultado CV + síntesis TAP + síntesis DV<html:br/>Convergencia · complementariedad · divergencia · expansión<html:br/>Registrar también vacíos y materiales no comparables</html:div></html:div></foreignObject><rect x="90.0" y="733.0" width="740.0" height="115.0" rx="0" fill="#F4E5CF" stroke="#6B7D88" stroke-width="1.4" stroke-dasharray="8 5"/><foreignObject x="90.0" y="733.0" width="740.0" height="115.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:8.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:25.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>Metainferencia</html:b><html:br/>¿Qué comprensión añade la relación entre fuentes?<html:br/>Interpretación + evidencias + alcance + límites</html:div></html:div></foreignObject><rect x="45.0" y="902.0" width="830.0" height="91.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4"/><foreignObject x="45.0" y="902.0" width="830.0" height="91.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:21.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>Control transversal</html:b><html:br/>Cada afirmación conserva caso, momento, localizador y versión.<html:br/>TAP y DV aportan personas diferentes; no forman una trayectoria individual.</html:div></html:div></foreignObject></svg>