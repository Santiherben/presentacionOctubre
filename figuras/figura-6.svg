h="350.0" height="109.0" rx="0" fill="#DAE5E1" stroke="#6B7D88" stroke-width="1.4"/><foreignObject x="70.0" y="205.0" width="350.0" height="109.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:8.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:24.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>RAZ-INI</html:b><html:br/>Viñeta base abierta<html:br/>Decisión y verbalización inicial</html:div></html:div></foreignObject><rect x="500.0" y="205.0" width="350.0" height="109.0" rx="0" fill="#DAE5E1" stroke="#6B7D88" stroke-width="1.4"/><foreignObject x="500.0" y="205.0" width="350.0" height="109.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:8.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:24.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>RAZ-VAR</html:b><html:br/>Un solo dato nuevo<html:br/>Continuidad · matiz · cambio</html:div></html:div></foreignObject><rect x="70.0" y="355.0" width="780.0" height="91.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4"/><foreignObject x="70.0" y="355.0" width="780.0" height="91.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:22.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>Regla prevista durante la tarea</html:b><html:br/>Recordatorio neutral tras 8–10 s de silencio<html:br/>Intervalo operativo del estudio</html:div></html:div></foreignObject><rect x="50.0" y="505.0" width="820.0" height="132.0" rx="0" fill="#EBC6B0" stroke="#6B7D88" stroke-width="1.4"/><foreignObject x="50.0" y="505.0" width="820.0" height="132.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:8.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:23.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>RET · retrospectiva inmediata</html:b><html:br/>Aspecto priorizado · reconsideración · seguridad<html:br/>La seguridad inicial y posterior se pregunta después de la tarea.<html:br/>Pregunta específica y transversal opcional según el guion.</html:div></html:div></foreignObject><rect x="50.0" y="686.0" width="820.0" height="96.0" rx="0" fill="#F4E5CF" stroke="#6B7D88" stroke-width="1.4"/><foreignObject x="50.0" y="686.0" width="820.0" height="96.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:8.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:23.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>Cierre comparativo</html:b><html:br/>Se comunica decisión, criterio y seguridad del CV<html:br/>Se analiza como respuesta a esa devolución.</html:div></html:div></foreignObject><rect x="50.0" y="832.0" width="820.0" height="132.0" rx="0" fill="#E3ECF1" stroke="#6B7D88" stroke-width="1.4"/><foreignObject x="50.0" y="832.0" width="820.0" height="132.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:8.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:23.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div><html:b>Registro para el análisis</html:b><html:br/>Conservar preguntas, omisiones e intervenciones efectivas.<html:br/>Distinguir verbalización, explicación solicitada y retrospectiva.<html:br/>Revisar por separado cualquier discrepancia con el CV.</html:div></html:div></foreignObject><rect x="50.0" y="990.0" width="820.0" height="30.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4"/><foreignObject x="50.0" y="990.0" width="820.0" height="30.0"><html:div xmlns:html="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0.0px;text-align:center;font-family:&quot;Times New Roman&quot;,Times,serif;font-size:20.0px;line-height:1.14;color:#294F66;font-weight:400;font-style:normal;"><html:div>El esquema describe el guion; la transcripción acredita su aplicación.</html:div></html:div></foreignObject></svg>